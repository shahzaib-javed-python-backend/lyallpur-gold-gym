{% extends 'navigationbar.html' %}

{% block body %}
<div class="container py-4">
  <h2 class="text-primary mb-4 text-center">Add Equipment</h2>
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-12"><label class="form-label fw-bold">Equipment Name</label><input class="form-control" name="name" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Price (In Rs.)</label><input class="form-control" type="number" min="0" step="0.01" name="price" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Unit</label><input class="form-control" name="unit" placeholder="Piece, Set, Kg" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Purchase Date</label><input class="form-control" type="date" name="purchase_date"></div>
    <div class="col-md-6"><label class="form-label fw-bold">Condition</label><input class="form-control" name="condition" value="Good" required></div>
    <div class="col-12"><label class="form-label fw-bold">Description</label><textarea class="form-control" name="description" rows="4"></textarea></div>
    <div class="col-12"><button class="btn btn-primary w-100" type="submit">Submit</button></div>
  </form>
</div>
{% endblock %}
