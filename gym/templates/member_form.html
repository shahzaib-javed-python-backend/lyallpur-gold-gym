{% extends 'navigationbar.html' %}

{% block body %}
<div class="container py-4">
  <h2 class="text-primary mb-4 text-center">Add New Member</h2>
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-12"><label class="form-label fw-bold">Name</label><input class="form-control" name="name" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Contact</label><input class="form-control" name="phone" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">EmailID</label><input class="form-control" type="email" name="email"></div>
    <div class="col-md-6"><label class="form-label fw-bold">Age</label><input class="form-control" type="number" min="1" name="age"></div>
    <div class="col-md-6"><label class="form-label fw-bold d-block">Gender</label><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Male" id="male"><label class="form-check-label" for="male">Male</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Female" id="female"><label class="form-check-label" for="female">Female</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Other" id="other"><label class="form-check-label" for="other">Other</label></div></div>
    <div class="col-md-6"><label class="form-label fw-bold">Plan Name</label><select class="form-select" name="plan"><option value="">Select plan</option>{% for plan in plans %}<option value="{{ plan.id }}">{{ plan.name }} - Rs. {{ plan.price }}</option>{% empty %}<option disabled>No active plans available</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label fw-bold">Join Date</label><input class="form-control" type="date" name="join_date" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Plan Expire Date</label><input class="form-control" type="date" name="expiry_date"></div>
    <div class="col-md-6"><label class="form-label fw-bold">Initial Amount (In Rs.)</label><input class="form-control" type="number" min="0" step="0.01" name="initial_amount" value="0" required></div>
    <div class="col-12"><button class="btn btn-primary w-100" type="submit">Submit</button></div>
  </form>
</div>
{% endblock %}
