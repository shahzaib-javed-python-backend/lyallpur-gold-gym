{% extends 'navigationbar.html' %}

{% block body %}
<div class="container py-4">
  <h2 class="text-primary mb-4">Add Membership Plan</h2>
  <form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6"><label class="form-label">Plan name</label><input class="form-control" name="name" required></div>
    <div class="col-md-3"><label class="form-label">Duration (months)</label><input class="form-control" type="number" min="1" name="duration_months" required></div>
    <div class="col-md-3"><label class="form-label">Price</label><input class="form-control" type="number" min="0" step="0.01" name="price" required></div>
    <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Save Plan</button></div>
  </form>
</div>
{% endblock %}
